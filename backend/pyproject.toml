# pyproject.toml — RecruitAI backend
# Configures Ruff (linting + formatting) and pytest in one file.
# Ruff replaces: black, isort, flake8, bandit, pyupgrade

[tool.ruff]
target-version = "py312"
line-length    = 100
indent-width   = 4

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort — import ordering
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade — modernise syntax
  "N",   # pep8-naming
  "RUF", # Ruff-specific rules
]
ignore = [
  "E501", # line length enforced by formatter, not linter
  "B008", # FastAPI Depends() in function args is intentional
]
fixable   = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "ANN", "N802"]

[tool.ruff.lint.isort]
known-first-party = [
  "api", "auth", "database",
  "models", "schemas", "services",
  "middleware", "utils",
]

[tool.ruff.format]
quote-style               = "double"
indent-style              = "space"
skip-magic-trailing-comma = false
line-ending               = "lf"

[tool.pytest.ini_options]
asyncio_mode     = "auto"
testpaths        = ["tests"]
python_files     = ["test_*.py"]
python_classes   = ["Test*"]
python_functions = ["test_*"]
addopts          = "-v --tb=short --cov=. --cov-report=term-missing --cov-fail-under=80"
filterwarnings   = [
  "ignore::DeprecationWarning",
  "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["."]
omit   = [
  "tests/*",
  "*/__pycache__/*",
  "main.py",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "@abstractmethod",
  "raise NotImplementedError",
]
